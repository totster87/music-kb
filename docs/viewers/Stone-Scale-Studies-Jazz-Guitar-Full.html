/* swipe carousel — added by add_swipe_carousels.py */
.swipe-wrap { position: relative; margin: 8px 0 4px; }
.swipe {
  display: flex;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  border-radius: 6px;
  background: #161616;
}
.swipe::-webkit-scrollbar { display: none; }
.swipe > .slide {
  flex: 0 0 100%;
  min-width: 100%;
  scroll-snap-align: start;
  scroll-snap-stop: always;
}
.swipe > .slide img { width: 100%; display: block; }
.swipe-counter {
  position: absolute;
  top: 8px; right: 10px;
  background: rgba(0,0,0,0.65);
  color: #ddd;
  font-size: 0.72rem;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 10px;
  pointer-events: none;
  letter-spacing: 0.03em;
}
.swipe-hint {
  text-align: center;
  font-size: 0.7rem;
  color: #555;
  margin-top: 4px;
  letter-spacing: 0.05em;
}
</style>

<script>
(function() {
  document.querySelectorAll('.swipe-wrap').forEach(function(wrap) {
    var track = wrap.querySelector('.swipe');
    var counter = wrap.querySelector('.swipe-counter');
    if (!track || !counter) return;
    var total = track.children.length;
    function update() {
      var idx = Math.round(track.scrollLeft / track.clientWidth) + 1;
      if (idx < 1) idx = 1;
      if (idx > total) idx = total;
      counter.textContent = idx + ' / ' + total;
    }
    track.addEventListener('scroll', update, { passive: true });
    window.addEventListener('resize', update);
    update();
  });
})();
