<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABR — Fault Line</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #111; font-family: -apple-system, sans-serif; color: #ddd; line-height: 1.6; }
  header { position: sticky; top: 0; background: #0a0a0a; padding: 14px 20px;
            border-bottom: 1px solid #222; z-index: 10; }
  header h1 { font-size: 1rem; color: #fff; }
  header p { font-size: 0.75rem; color: #666; margin-top: 2px; }
  .content { max-width: 860px; margin: 0 auto; padding: 20px 16px; }
  .section-label { font-size: 0.75rem; font-weight: 600; color: #888;
                   text-transform: uppercase; letter-spacing: 0.08em;
                   margin: 24px 0 8px; }
  .section-label:first-child { margin-top: 0; }
  .swipe-wrap { position: relative; margin: 0 0 4px; }
  .swipe { display: flex; overflow-x: auto; scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch; scrollbar-width: none;
            border-radius: 8px; background: #161616; box-shadow: 0 2px 12px rgba(0,0,0,0.4); }
  .swipe::-webkit-scrollbar { display: none; }
  .swipe > .slide { flex: 0 0 100%; min-width: 100%; scroll-snap-align: start;
                    scroll-snap-stop: always; background: #1a1a1a; }
  .slide .page-label { padding: 7px 16px; font-size: 0.7rem; color: #555;
                       background: #111; border-bottom: 1px solid #222; }
  .slide img { width: 100%; display: block; min-height: 200px; background: #1a1a1a; }
  .swipe-counter { position: absolute; top: 8px; right: 10px;
                   background: rgba(0,0,0,0.65); color: #ddd; font-size: 0.72rem;
                   font-weight: 600; padding: 3px 8px; border-radius: 10px;
                   pointer-events: none; letter-spacing: 0.03em; }
  .swipe-hint { text-align: center; font-size: 0.7rem; color: #555;
                margin-top: 4px; letter-spacing: 0.05em; margin-bottom: 4px; }
</style>
</head>
<body>
<header>
  <h1>ABR — Fault Line</h1>
  <p>Guitar · After the Burial</p>
</header>
<div class="content">
<div class="swipe-wrap">
<div class="swipe">
<div class="slide"><div class="page-label">Page 33</div><img src="https://media.githubusercontent.com/media/totster87/music-kb/main/docs/rendered/abr-rescue-and-restore/page-033.png" alt="Page 33" loading="lazy"></div>
<div class="slide"><div class="page-label">Page 34</div><img src="https://media.githubusercontent.com/media/totster87/music-kb/main/docs/rendered/abr-rescue-and-restore/page-034.png" alt="Page 34" loading="lazy"></div>
<div class="slide"><div class="page-label">Page 35</div><img src="https://media.githubusercontent.com/media/totster87/music-kb/main/docs/rendered/abr-rescue-and-restore/page-035.png" alt="Page 35" loading="lazy"></div>
<div class="slide"><div class="page-label">Page 36</div><img src="https://media.githubusercontent.com/media/totster87/music-kb/main/docs/rendered/abr-rescue-and-restore/page-036.png" alt="Page 36" loading="lazy"></div>
<div class="slide"><div class="page-label">Page 37</div><img src="https://media.githubusercontent.com/media/totster87/music-kb/main/docs/rendered/abr-rescue-and-restore/page-037.png" alt="Page 37" loading="lazy"></div>
<div class="slide"><div class="page-label">Page 38</div><img src="https://media.githubusercontent.com/media/totster87/music-kb/main/docs/rendered/abr-rescue-and-restore/page-038.png" alt="Page 38" loading="lazy"></div>
<div class="slide"><div class="page-label">Page 39</div><img src="https://media.githubusercontent.com/media/totster87/music-kb/main/docs/rendered/abr-rescue-and-restore/page-039.png" alt="Page 39" loading="lazy"></div>
<div class="slide"><div class="page-label">Page 40</div><img src="https://media.githubusercontent.com/media/totster87/music-kb/main/docs/rendered/abr-rescue-and-restore/page-040.png" alt="Page 40" loading="lazy"></div>
<div class="slide"><div class="page-label">Page 41</div><img src="https://media.githubusercontent.com/media/totster87/music-kb/main/docs/rendered/abr-rescue-and-restore/page-041.png" alt="Page 41" loading="lazy"></div>
<div class="slide"><div class="page-label">Page 42</div><img src="https://media.githubusercontent.com/media/totster87/music-kb/main/docs/rendered/abr-rescue-and-restore/page-042.png" alt="Page 42" loading="lazy"></div>

</div>
<div class="swipe-counter">1 / 14</div>
</div>
<div class="swipe-hint">← swipe →</div>
</div>
<script>
(function() {
  document.querySelectorAll('.swipe-wrap').forEach(function(wrap) {
    var track = wrap.querySelector('.swipe');
    var counter = wrap.querySelector('.swipe-counter');
    if (!track || !counter) return;
    var total = track.children.length;
    function update() {
      var idx = Math.round(track.scrollLeft / track.clientWidth) + 1;
      if (idx < 1) idx = 1; if (idx > total) idx = total;
      counter.textContent = idx + ' / ' + total;
    }
    track.addEventListener('scroll', update, { passive: true });
    window.addEventListener('resize', update);
    update();
  });
})();
</script>
</body>
</html>
