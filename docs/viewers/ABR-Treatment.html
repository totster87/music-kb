<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABR — Treatment</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #111; font-family: -apple-system, sans-serif; color: #ddd; line-height: 1.6; }
  header { position: sticky; top: 0; background: #0a0a0a; padding: 14px 20px;
            border-bottom: 1px solid #222; z-index: 10; }
  header h1 { font-size: 1rem; color: #fff; }
  header p { font-size: 0.75rem; color: #666; margin-top: 2px; }
  .content { max-width: 860px; margin: 0 auto; padding: 20px 16px; }
  .section-label { font-size: 0.75rem; font-weight: 600; color: #888;
                   text-transform: uppercase; letter-spacing: 0.08em;
                   margin: 24px 0 8px; }
  .section-label:first-child { margin-top: 0; }
  .swipe-wrap { position: relative; margin: 0 0 4px; }
  .swipe { display: flex; overflow-x: auto; scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch; scrollbar-width: none;
            border-radius: 8px; background: #161616; box-shadow: 0 2px 12px rgba(0,0,0,0.4); }
  .swipe::-webkit-scrollbar { display: none; }
  .swipe > .slide { flex: 0 0 100%; min-width: 100%; scroll-snap-align: start;
                    scroll-snap-stop: always; background: #1a1a1a; }
  .slide .page-label { padding: 7px 16px; font-size: 0.7rem; color: #555;
                       background: #111; border-bottom: 1px solid #222; }
  .slide img { width: 100%; display: block; min-height: 200px; background: #1a1a1a; }
  .swipe-counter { position: absolute; top: 8px; right: 10px;
                   background: rgba(0,0,0,0.65); color: #ddd; font-size: 0.72rem;
                   font-weight: 600; padding: 3px 8px; border-radius: 10px;
                   pointer-events: none; letter-spacing: 0.03em; }
  .swipe-hint { text-align: center; font-size: 0.7rem; color: #555;
                margin-top: 4px; letter-spacing: 0.05em; margin-bottom: 4px; }
</style>
</head>
<body>
<header>
  <h1>ABR — Treatment</h1>
  <p>Guitar · After the Burial</p>
</header>
<div class="content">
<div class="swipe-wrap">
<div class="swipe">
<div class="slide"><div class="page-label">Page 18</div><img src="https://media.githubusercontent.com/media/totster87/music-kb/main/docs/rendered/abr-rescue-and-restore/page-018.png" alt="Page 18" loading="lazy"></div>
<div class="slide"><div class="page-label">Page 19</div><img src="https://media.githubusercontent.com/media/totster87/music-kb/main/docs/rendered/abr-rescue-and-restore/page-019.png" alt="Page 19" loading="lazy"></div>
<div class="slide"><div class="page-label">Page 20</div><img src="https://media.githubusercontent.com/media/totster87/music-kb/main/docs/rendered/abr-rescue-and-restore/page-020.png" alt="Page 20" loading="lazy"></div>
<div class="slide"><div class="page-label">Page 21</div><img src="https://media.githubusercontent.com/media/totster87/music-kb/main/docs/rendered/abr-rescue-and-restore/page-021.png" alt="Page 21" loading="lazy"></div>
<div class="slide"><div class="page-label">Page 22</div><img src="https://media.githubusercontent.com/media/totster87/music-kb/main/docs/rendered/abr-rescue-and-restore/page-022.png" alt="Page 22" loading="lazy"></div>
<div class="slide"><div class="page-label">Page 23</div><img src="https://media.githubusercontent.com/media/totster87/music-kb/main/docs/rendered/abr-rescue-and-restore/page-023.png" alt="Page 23" loading="lazy"></div>
<div class="slide"><div class="page-label">Page 24</div><img src="https://media.githubusercontent.com/media/totster87/music-kb/main/docs/rendered/abr-rescue-and-restore/page-024.png" alt="Page 24" loading="lazy"></div>
<div class="slide"><div class="page-label">Page 25</div><img src="https://media.githubusercontent.com/media/totster87/music-kb/main/docs/rendered/abr-rescue-and-restore/page-025.png" alt="Page 25" loading="lazy"></div>
<div class="slide"><div class="page-label">Page 26</div><img src="https://media.githubusercontent.com/media/totster87/music-kb/main/docs/rendered/abr-rescue-and-restore/page-026.png" alt="Page 26" loading="lazy"></div>
<div class="slide"><div class="page-label">Page 27</div><img src="https://media.githubusercontent.com/media/totster87/music-kb/main/docs/rendered/abr-rescue-and-restore/page-027.png" alt="Page 27" loading="lazy"></div>
<div class="slide"><div class="page-label">Page 28</div><img src="https://media.githubusercontent.com/media/totster87/music-kb/main/docs/rendered/abr-rescue-and-restore/page-028.png" alt="Page 28" loading="lazy"></div>
<div class="slide"><div class="page-label">Page 29</div><img src="https://media.githubusercontent.com/media/totster87/music-kb/main/docs/rendered/abr-rescue-and-restore/page-029.png" alt="Page 29" loading="lazy"></div>
<div class="slide"><div class="page-label">Page 30</div><img src="https://media.githubusercontent.com/media/totster87/music-kb/main/docs/rendered/abr-rescue-and-restore/page-030.png" alt="Page 30" loading="lazy"></div>
<div class="slide"><div class="page-label">Page 31</div><img src="https://media.githubusercontent.com/media/totster87/music-kb/main/docs/rendered/abr-rescue-and-restore/page-031.png" alt="Page 31" loading="lazy"></div>
<div class="slide"><div class="page-label">Page 32</div><img src="https://media.githubusercontent.com/media/totster87/music-kb/main/docs/rendered/abr-rescue-and-restore/page-032.png" alt="Page 32" loading="lazy"></div>
</div>
<div class="swipe-counter">1 / 15</div>
</div>
<div class="swipe-hint">← swipe →</div>
</div>
<script>
(function() {
  document.querySelectorAll('.swipe-wrap').forEach(function(wrap) {
    var track = wrap.querySelector('.swipe');
    var counter = wrap.querySelector('.swipe-counter');
    if (!track || !counter) return;
    var total = track.children.length;
    function update() {
      var idx = Math.round(track.scrollLeft / track.clientWidth) + 1;
      if (idx < 1) idx = 1; if (idx > total) idx = total;
      counter.textContent = idx + ' / ' + total;
    }
    track.addEventListener('scroll', update, { passive: true });
    window.addEventListener('resize', update);
    update();
  });
})();
</script>
</body>
</html>
